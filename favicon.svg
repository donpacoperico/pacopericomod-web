<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="campo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27466e"/>
      <stop offset="1" stop-color="#14263f"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="0.5" stop-color="#d4a23a"/>
      <stop offset="1" stop-color="#9c6d1c"/>
    </linearGradient>
    <linearGradient id="hoja" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9edf2"/>
      <stop offset="0.5" stop-color="#b9c2cc"/>
      <stop offset="1" stop-color="#7d8896"/>
    </linearGradient>
    <linearGradient id="pluma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd56a"/>
      <stop offset="0.55" stop-color="#3fae4b"/>
      <stop offset="1" stop-color="#1f7136"/>
    </linearGradient>
    <linearGradient id="pico" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf1d6"/>
      <stop offset="1" stop-color="#d9c08c"/>
    </linearGradient>
  </defs>


  <!-- Escudo -->
  <path d="M18 10 H238 V118 C238 192 188 230 128 250 C68 230 18 192 18 118 Z" fill="url(#oro)" stroke="#4a3309" stroke-width="9" stroke-linejoin="round"/>
  <path d="M36 26 H220 V118 C220 182 178 214 128 232 C78 214 36 182 36 118 Z" fill="url(#campo)" stroke="#0c1726" stroke-width="5" stroke-linejoin="round"/>

  <!-- Don Paco Perico: cabeza de perfil, mirando a la izquierda -->
  <g transform="translate(-58 -62) scale(1.42)">
  <g stroke="#123d1f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- cuello y cabeza -->
    <path d="M118 92 C140 72 178 80 182 116 C185 140 176 158 168 172 C163 182 160 192 160 204 L132 210 C134 192 132 178 126 168 C116 152 104 140 104 120 C104 106 109 98 118 92 Z" fill="url(#pluma)"/>
    <!-- pico: mandíbula de arriba en gancho y la de abajo -->
    <path d="M112 102 C88 96 66 110 64 134 C63 147 70 157 81 159 C77 148 80 138 90 135 C98 132 106 134 113 139 Z" fill="url(#pico)"/>
    <path d="M113 139 C104 142 96 148 95 156 C103 161 114 158 121 150 Z" fill="#5a5148"/>
  </g>
  <!-- frente amarilla y mejilla roja -->
  <path d="M120 96 C130 88 146 86 156 90 C148 92 136 96 128 104 Z" fill="#f2cf3a"/>
  <ellipse cx="146" cy="136" rx="13" ry="9" fill="#e2503a" opacity="0.9"/>
  <!-- ojo -->
  <circle cx="132" cy="116" r="12" fill="#fffaf0" stroke="#123d1f" stroke-width="3.5"/>
  <circle cx="129" cy="116" r="6" fill="#1b1b1b"/>
  <circle cx="127" cy="113.5" r="2" fill="#ffffff"/>
  <!-- plumas del cuello -->
  <path d="M150 160 C156 168 158 178 156 190" fill="none" stroke="#1f7136" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M164 150 C170 158 172 168 170 178" fill="none" stroke="#1f7136" stroke-width="3.5" stroke-linecap="round"/>
  </g>

</svg>
